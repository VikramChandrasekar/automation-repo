name: Selenium Java UI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run TestNG Selenium Suite via Maven
        run: mvn clean test -Dsurefire.suiteXmlFiles=src/test/resources/testng-regression.xml
