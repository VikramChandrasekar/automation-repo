name: Enterprise Java API Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  maven-regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Execute Regression TestNG Suite
        run: mvn clean test -Dsurefire.suiteXmlFiles=src/test/resources/testng-regression.xml
